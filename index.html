<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Finish the Word</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f4f4;
  color:#111;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  padding:12px;
  box-shadow:0 1px 5px #bbb;
}

input{
  width:100%;
  font-size:22px;
  padding:12px;
  border:2px solid #777;
  border-radius:10px;
  outline:none;
}

input:focus{
  border-color:#111;
}

#status{
  margin-top:7px;
  font-size:13px;
  color:#666;
}

main{
  padding:12px;
  max-width:700px;
  margin:auto;
}

#prefix{
  margin-bottom:8px;
  font-size:14px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.word{
  background:white;
  border-radius:8px;
  padding:9px 10px;
  font-size:18px;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.msg{
  background:white;
  border-radius:10px;
  padding:14px;
  color:#666;
}

button{
  display:block;
  margin:14px auto;
  padding:10px 18px;
  border:0;
  border-radius:8px;
  background:#222;
  color:white;
  font-size:16px;
}

button:active{
  transform:scale(.98);
}

@media(max-width:420px){
  .grid{
    grid-template-columns:1fr;
  }

  .word{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>

<input
  id="q"
  autocomplete="off"
  autocapitalize="characters"
  spellcheck="false"
  placeholder="Type letters..."
>

<div id="status">
  Loading words...
</div>

</header>

<main>

<div id="prefix"></div>

<div id="out" class="msg">
  Loading word database...
</div>

</main>

<script>

/* =========================
   WORD DATABASE
   ========================= */

const WORDS = [

"abacus",
"abandon",
"aberration",
"abeyance",
"abhorrence",
"abnegation",
"abrogate",
"abscond",
"abstemious",
"acclimate",
"acquiesce",
"acrimonious",
"admonish",
"adulation",
"adversarial",
"aesthetic",
"affable",
"alacrity",
"alleviate",
"ambiguous",
"ameliorate",
"anachronism",
"animosity",
"antithesis",
"apocryphal",
"appease",
"arbitrary",
"arcane",
"arduous",
"articulate",
"ascertain",
"assiduous",
"astute",
"audacious",
"auspicious",
"avarice",

"belligerent",
"benevolent",
"bombastic",
"boisterous",

"cacophony",
"camaraderie",
"capricious",
"circumlocution",
"clandestine",
"coalesce",
"cogent",
"commensurate",
"conundrum",
"corroborate",
"credulous",
"culmination",

"deference",
"deleterious",
"demagogue",
"denouement",
"derivative",
"desultory",
"diaphanous",
"didactic",
"diffident",
"dilapidated",
"disparate",
"disseminate",

"ebullient",
"eclectic",
"effervescent",
"egregious",
"eloquent",
"embellish",
"emulate",
"enigma",
"ephemeral",
"equanimity",
"erudite",
"esoteric",
"evanescent",
"exacerbate",
"exculpate",
"exigent",
"exorbitant",
"expedient",

"facetious",
"fallacious",
"fastidious",
"flabbergasted",
"fortuitous",

"gregarious",

"hackneyed",
"hegemony",

"iconoclast",
"idiosyncratic",
"immutable",
"impetuous",
"incorrigible",
"indefatigable",
"ineffable",
"ingenuous",
"inimical",
"insidious",
"insipid",
"intrepid",

"juxtaposition",

"laconic",
"laudable",
"lethargic",
"loquacious",

"magnanimous",
"malevolent",
"meticulous",
"mnemonic",

"nefarious",
"nonchalant",

"obfuscate",
"obsequious",
"omniscient",
"ostentatious",

"paradigm",
"parsimonious",
"perfunctory",
"pernicious",
"perspicacious",
"philanthropic",
"pompous",
"precocious",
"procrastinate",
"prodigious",
"proliferate",

"querulous",
"quintessential",

"recalcitrant",
"reclusive",
"reconciliation",
"redundant",
"relinquish",
"resilient",
"reticent",

"sagacious",
"scrupulous",
"serendipity",
"soliloquy",
"spontaneous",
"sporadic",
"substantiate",
"supercalifragilisticexpialidocious",
"surreptitious",
"sycophant",

"tenacious",
"transcend",

"ubiquitous",
"unprecedented",

"vehement",
"verbose",
"vindicate",
"vociferous",

"whimsical",

"zealous"

];


/* =========================
   SETTINGS
   ========================= */

const PAGE_SIZE = 100;

let matches = [];
let shown = 0;
let currentPrefix = "";


/* =========================
   ELEMENTS
   ========================= */

const q = document.getElementById("q");
const out = document.getElementById("out");
const prefix = document.getElementById("prefix");
const status = document.getElementById("status");


/* =========================
   CLEAN INPUT
   ========================= */

function cleanInput(value){

  return value
    .toLowerCase()
    .replace(/[^a-z]/g,"");

}


/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value){

  return String(value).replace(/[&<>"']/g,function(ch){

    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[ch];

  });

}


/* =========================
   SEARCH WORDS
   ========================= */

function searchWords(){

  currentPrefix = cleanInput(q.value);

  prefix.textContent =
    currentPrefix
      ? "Prefix: " + currentPrefix.toUpperCase()
      : "";

  matches = [];
  shown = 0;

  const oldButton =
    document.getElementById("moreBtn");

  if(oldButton){
    oldButton.remove();
  }


  if(!currentPrefix){

    out.className = "msg";

    out.textContent =
      "Waiting for letters...";

    status.textContent =
      WORDS.length +
      " words loaded.";

    return;
  }


  for(const word of WORDS){

    if(word.startsWith(currentPrefix)){

      matches.push(word);

    }

  }


  if(matches.length === 0){

    out.className = "msg";

    out.textContent =
      "No words found.";

    status.textContent =
      "0 words found.";

    return;
  }


  renderResults(true);

}


/* =========================
   SHOW RESULTS
   ========================= */

function renderResults(reset){

  if(reset){

    shown = 0;

    out.innerHTML = "";

  }


  const end =
    Math.min(
      shown + PAGE_SIZE,
      matches.length
    );


  const fragment =
    document.createDocumentFragment();


  for(
    let i = shown;
    i < end;
    i++
  ){

    const word =
      matches[i];

    const card =
      document.createElement("div");

    card.className =
      "word";


    const beginning =
      word.slice(
        0,
        currentPrefix.length
      );


    const rest =
      word.slice(
        currentPrefix.length
      );


    card.innerHTML =
      "<b>" +
      escapeHTML(beginning) +
      "</b>" +
      escapeHTML(rest);


    fragment.appendChild(card);

  }


  out.className = "grid";

  out.appendChild(fragment);

  shown = end;


  const oldButton =
    document.getElementById("moreBtn");

  if(oldButton){
    oldButton.remove();
  }


  if(shown < matches.length){

    const button =
      document.createElement("button");

    button.id =
      "moreBtn";

    button.textContent =
      "Show More (" +
      (matches.length - shown) +
      " left)";


    button.onclick =
      function(){

        renderResults(false);

      };


    out.parentNode.appendChild(button);

  }


  status.textContent =
    matches.length +
    " word" +
    (matches.length === 1 ? "" : "s") +
    " found";

}


/* =========================
   INPUT
   ========================= */

q.addEventListener(
  "input",
  searchWords
);


/* =========================
   START
   ========================= */

status.textContent =
  WORDS.length +
  " words loaded.";

q.focus();

</script>

</body>
</html>
